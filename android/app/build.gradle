apply plugin: 'com.android.application'

// ── RELEASE SIGNING — CREDENTIALS LOADED FROM A GITIGNORED FILE, IF IT IS THERE ─────────────────────
// `android/keystore.properties` holds the upload-key credentials and is NEVER committed. See
// android/SIGNING.md; the committed template is android/keystore.properties.example.
//
// 🔴 THE `.exists()` GUARD IS THE WHOLE POINT AND MUST NOT BE REMOVED. A fresh clone, a CI runner, or
// anyone who has not been given the credentials has NO keystore.properties — and a build that dies on
// its absence would break `assembleDebug` for every one of them. Absent file => the release
// signingConfig is never created, `signingConfigs.release` is never referenced, and debug builds are
// completely unaffected.
// ⚠️ A RELEASE BUILT WITHOUT IT IS UNSIGNED, which is the pre-existing behaviour and the correct
// failure direction: Play rejects it at upload, loudly, instead of anything looking shippable.
//
// ⚠️ `rootProject` HERE IS THE `android/` DIRECTORY, not the repository root — this is the app module.
// So `rootProject.file("keystore.properties")` is android/keystore.properties, and a bare filename in
// `storeFile` resolves next to it. That is why the template documents storeFile as relative to android/.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.hatchgrab.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hatchgrab.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // android-1-1 (15 Nov 2026): 1.1, the second upload. Play's live release "HatchGrab V1" is version code 1.
        versionCode 2
        versionName "1.1"
        // android-1-1: the one native library in the bundle (androidx DataStore's libdatastore_shared_counter.so)
        // gets its symbol table packaged into the AAB, so Play can symbolise native crashes.
        ndk { debugSymbolLevel 'SYMBOL_TABLE' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Created ONLY when the credentials file is present — see the guard above.
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // ⚠️ Guarded for the same reason: referencing signingConfigs.release when it was never
            // created is a configuration-time failure, which would break debug builds too.
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            // ⛔ android-1-1 (15 Nov 2026, docs/android-1-1-report.md §2): R8 IS ON — that "own workstream".
            // Play flags the bundle's DEX as below its optimization / obfuscation threshold (enforced Feb 2027)
            // and as having no deobfuscation file. R8 shrinks, optimizes and obfuscates; its mapping is written
            // to app/build/outputs/mapping/release/mapping.txt AND embedded in the AAB's BUNDLE-METADATA, which
            // Play reads on upload. The reflection the old comment feared is covered by Capacitor's own consumer
            // rules (every Plugin subclass, every @PluginMethod) plus proguard-rules.pro (Capacitor and every
            // plugin package kept whole). Proved on the MINIFIED build on Android 14, 15 and 16 before upload.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
