name: Hatchesup Menu Scraper

# 🔴 THE SCHEDULE IS OFF — turned off 2 September 2026 on request.
#
# It was: schedule: - cron: '*/30 * * * *'   (every 30 minutes)
#
# WHY, beyond being asked: data/hatchesup-trucks.json holds 36 entries and ALL 36 were already marked
# processed — the file has not changed since 9 June 2026. So every fire since then has spun up a runner,
# installed Chrome, run npm ci, found nothing to do and exited. It was also committing to the repo on
# each run ("chore: hatchesup scraper progress update"), which is why those commits fill the log.
#
# 🟢 workflow_dispatch IS KEPT ON PURPOSE. The scraper still works and can be run by hand from the
# GitHub Actions tab whenever there is a new batch to process; nothing was deleted. To put it back on a
# timer, restore the two schedule lines above.
#
# ⚠️ EDITING THIS FILE DOES NOT STOP THE SCHEDULE. GitHub reads workflows from the DEFAULT BRANCH, so
# the cron keeps firing until this change is committed and pushed. To stop it immediately, disable
# "Hatchesup Menu Scraper" in the repo's Actions tab (⋯ menu → Disable workflow).
on:
  workflow_dispatch:           # manual trigger from the GitHub UI only

permissions:
  contents: write              # needed to commit the updated truck list back

jobs:
  process-truck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Process next truck
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/process-next-truck.js

      - name: Commit updated truck list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hatchesup-trucks.json
          git diff --staged --quiet || git commit -m "chore: hatchesup scraper progress update"
          git push
