name: Competitor check

# competitor-check-1 (25 October 2026, docs/competitor-check-1-report.md): re-reads every known competitor's own website with
# the Claude API (web fetch + web search) and PROPOSES changes, which Dominic accepts or rejects in Admin › Pricing check ›
# Automatic checks. It writes only competitor_check_runs, competitor_check_findings and the competitors' scheduling
# columns — never a plan, a price, a feature or a verification.
#
# ⚠️ SCHEDULED WORKFLOWS RUN ONLY FROM THE DEFAULT BRANCH: nothing runs on the timer until this file is merged.
# 🔴 CLAUDE API LOGIN: Workload Identity Federation (competitor-check-1c, 27 October 2026) — no API key anywhere. The job
# asks GitHub for an OIDC token (audience https://api.anthropic.com), writes it to /tmp/gha-jwt and re-fetches it every 60 s;
# the SDK exchanges it using four repository VARIABLES (Settings › Secrets and variables › Actions › Variables):
# ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID.
# SECRETS (names only): NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (the scraper's), and — for the summary
# email, optional — BREVO_API_KEY and EMAIL_FROM_ADDRESS (without them the email is skipped with a warning).
# competitor-check-2 (29 October 2026, docs/competitor-check-2-report.md):
#   • the FIRST step imports any registered data file not yet imported in its current version (lib/data-import) — no API
#     call, no login; a failed import is a red cross, and the check still runs;
#   • a failed Claude API login stops the run at once and exits non-zero, as does a run in which every competitor failed;
#   • the token refresh logs each re-fetch with a time and a running count, printed at the end of the job.
on:
  schedule:
    - cron: '10 2 * * *'          # daily, 02:10 UTC — clear of the 03:30 prune and the 06:00 discovery scrape
  workflow_dispatch:
    inputs:
      mode:
        description: 'routine, deep, single, or scheduled (what the timer runs: the deep share while a full deep check is requested, then the routine share)'
        required: true
        default: 'routine'
        type: choice
        options: [routine, deep, single, scheduled]
      competitor:
        description: 'For mode single: the competitor''s name or id'
        required: false
        default: ''
      limit:
        description: 'At most this many competitors (blank = the settings: deep per day, or the routine share)'
        required: false
        default: ''
      dry_run:
        description: 'Call the API but write nothing — print the findings'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Two runs never overlap: a manual run waits for the scheduled one, and vice versa.
concurrency:
  group: competitor-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 240          # 15 deep checks with their second checks fit well inside; the budget caps stop it first
    # id-token: write lets the job ask GitHub for the OIDC token the Claude API login exchanges.
    permissions:
      id-token: write
      contents: read
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Before any API call and with no Claude login: data files (data/compare-de-1/competitors.json first) are imported
      # once per version — public.data_imports records each file's sha256.
      - name: Import new data files
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/competitor-check/run.mjs scripts/data-import/main.ts
      # The GitHub OIDC token for the Claude API login. A token lasts about 5 minutes and can be exchanged only once, so a
      # background loop re-fetches it every 60 s for the rest of the job; the SDK re-reads the file at each refresh. Each
      # fetch writes a temporary file and renames it, so the SDK never reads a half-written token; a failed re-fetch
      # keeps the last good one.
      # !cancelled(): the check runs even when the import above failed (the job still ends with a red cross).
      - name: Get the GitHub OIDC token
        id: oidc
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          fetch_jwt() {
            curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > /tmp/gha-jwt.next \
              && [ -s /tmp/gha-jwt.next ] && [ "$(cat /tmp/gha-jwt.next)" != "null" ] && mv /tmp/gha-jwt.next /tmp/gha-jwt
          }
          fetch_jwt || { echo "Could not get a GitHub OIDC token (is id-token: write set?)"; exit 1; }
          echo "$(date -u +%FT%TZ) token fetched (0)" > /tmp/gha-jwt-refresh.log
          export -f fetch_jwt
          # Each re-fetch is logged with the time (UTC) and a running count; the last step prints the log.
          nohup bash -c 'n=0; while true; do sleep 60; n=$((n+1)); if fetch_jwt; then echo "$(date -u +%FT%TZ) token refreshed ($n)"; else echo "$(date -u +%FT%TZ) token re-fetch FAILED ($n); keeping the last one"; fi; done' >> /tmp/gha-jwt-refresh.log 2>&1 &
      - name: Check competitors
        if: ${{ !cancelled() && steps.oidc.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM_ADDRESS: ${{ secrets.EMAIL_FROM_ADDRESS }}
          MODE: ${{ github.event_name == 'schedule' && 'scheduled' || github.event.inputs.mode }}
          COMPETITOR: ${{ github.event.inputs.competitor }}
          LIMIT: ${{ github.event.inputs.limit }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        # Inputs reach the script as environment variables, never pasted into the shell line.
        run: |
          set -euo pipefail
          args=(--mode "$MODE")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then args+=(--manual); fi
          if [ -n "${COMPETITOR:-}" ]; then args+=(--competitor "$COMPETITOR"); fi
          if [ -n "${LIMIT:-}" ]; then args+=(--limit "$LIMIT"); fi
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          node scripts/competitor-check/run.mjs "${args[@]}"
      - name: Token refresh log
        if: ${{ always() }}
        run: cat /tmp/gha-jwt-refresh.log 2>/dev/null || echo "No token refresh log (the token step did not run)."
